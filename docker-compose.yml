services:
  postgres:
    build: ./deploy/postgres-zhparser
    image: trace-rag/pg-zhparser:pg16
    container_name: rag_postgres
    ports:
      - "5435:5432"  # host 5435 to avoid collision with other projects on 5432/5433
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpass
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init-extensions.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
