services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init-extensions.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: rag-backend:m1
    container_name: rag_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://raguser:${PG_PASSWORD}@postgres:5432/ragdb
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      OPENAI_EMBED_DIM: ${OPENAI_EMBED_DIM:-1536}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      UPLOAD_DIR: /data/uploads
      LOG_LEVEL: INFO
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: rag-frontend:m1
    container_name: rag_frontend
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8088
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: rag_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      AUTH_USER: ${AUTH_USER:-demo}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:?set AUTH_PASSWORD_HASH in .env}
    depends_on:
      - frontend

volumes:
  pg_data:
  uploads:
  caddy_data:
  caddy_config:
